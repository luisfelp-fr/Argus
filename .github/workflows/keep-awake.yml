name: Manter app Streamlit acordado

# Visita o app periodicamente para que o Streamlit Community Cloud não o coloque
# para dormir por inatividade — e o reativa caso já tenha dormido.
#
# A URL do app já está fixada abaixo (https://argus-analytics.streamlit.app/).
# Opcional: para trocar sem editar o arquivo, crie a variável de repositório
# STREAMLIT_APP_URL (Settings > Secrets and variables > Actions > Variables) —
# ela tem prioridade sobre o valor fixo.

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (horário UTC)
  workflow_dispatch: {}        # permite rodar manualmente pela aba Actions

# Evita execuções sobrepostas se uma demorar mais que o intervalo.
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright (Chromium)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visitar e acordar o app
        env:
          # Usa a variável de repositório se existir; senão, a URL fixa do app.
          APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://argus-analytics.streamlit.app/' }}
        run: python .github/scripts/keep_awake.py

      - name: Salvar screenshot (depuração)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-screenshot
          path: status.png
          if-no-files-found: ignore
          retention-days: 3
